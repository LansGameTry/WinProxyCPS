name: Build & Release WinProxy Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android Installer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build Debug APK
      working-directory: ./android
      run: |
        chmod +x gradlew || true
        gradle assembleDebug --stacktrace

    - name: Prepare APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk WinProxy-Installer.apk
        echo "APK build successful: WinProxy-Installer.apk"

    - name: Upload APK as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinProxy-Installer-APK
        path: WinProxy-Installer.apk

    - name: Release APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "WinProxy Android Installer v1.0.0"
        draft: false
        prerelease: false
        body: |
          ### 📱 WinProxy Android Installer (Liquid Glass Edition)
          
          Official quick installer application for Android Growtopia players.
          
          #### Features:
          - **1-Click Auto Install**: Automatically places `! WinProxy Loader.lua` into your Growtopia scripts folder.
          - **Liquid Glass Theme**: Modern glowing glassmorphism user interface.
          - **In-Game Command Center**: Complete built-in command reference guide.
          - **Auto-Updates**: Fetches the newest WinProxy updates directly from GitHub on every launch.
          
          #### How to Install:
          1. Download `WinProxy-Installer.apk` below.
          2. Open and install the APK on your Android device.
          3. Tap **INSTALL / UPDATE WINPROXY**.
          4. Open your Growtopia executor (Bothax / Powerkuy / Growlauncher) and run `! WinProxy Loader.lua`.
        files: WinProxy-Installer.apk
