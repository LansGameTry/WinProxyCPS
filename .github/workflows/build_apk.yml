name: Build WinProxy Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Android Installer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Build Debug APK
      working-directory: ./android
      run: |
        chmod +x gradlew || true
        gradle assembleDebug --stacktrace

    - name: Prepare APK Output
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk WinProxy-Installer.apk

    - name: Release APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.1
        name: "WinProxy Android Installer v1.0.1"
        files: WinProxy-Installer.apk
